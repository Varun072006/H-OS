apiVersion: apps/v1
kind: Deployment
metadata:
  name: humanos-backend
  namespace: humanos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: humanos-backend
  template:
    metadata:
      labels:
        app: humanos-backend
    spec:
      containers:
        - name: backend
          image: humanos/backend:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: humanos-backend-hpa
  namespace: humanos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: humanos-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
