<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HumanOS JavaScript SDK Browser Example</title>
  <style>
    body { font-family: monospace; background: #0a0a0f; color: #f3f4f6; padding: 2rem; }
    .card { background: #12131c; border: 1px solid #1e202e; border-radius: 8px; padding: 1rem; margin-top: 1rem; }
    .green { color: #10b981; }
  </style>
</head>
<body>
  <h1>HumanOS Web Browser Integration Demo</h1>
  <div class="card">
    <p>API Endpoint: <span id="endpoint">http://localhost:8000</span></p>
    <p>Status: <span id="status" class="green">Checking...</span></p>
    <button onclick="fetchState()">Get Live Human State</button>
  </div>
  <pre id="output" class="card">Click button to fetch state...</pre>

  <script>
    async function fetchState() {
      try {
        const res = await fetch('http://localhost:8000/v1/sessions/sess_demo/state');
        const data = await res.json();
        document.getElementById('output').textContent = JSON.stringify(data, null, 2);
        document.getElementById('status').textContent = 'CONNECTED';
      } catch (err) {
        document.getElementById('output').textContent = 'Error connecting to API server: ' + err.message;
        document.getElementById('status').textContent = 'DISCONNECTED';
      }
    }
  </script>
</body>
</html>
